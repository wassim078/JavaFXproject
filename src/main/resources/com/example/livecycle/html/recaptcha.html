<!DOCTYPE html>
<html>
<head>
    <!-- 1) explicit render, no onload parameter -->
    <script src="https://www.google.com/recaptcha/api.js?render=explicit"></script>

    <script>
        function initRecaptcha() {
            grecaptcha.render('recaptcha', {
                'sitekey'           : '6LdK5icrAAAAABmjiOyfWcvO4lPA8LdCUN4cc5qZ',
                'callback'          : onRecaptchaSuccess,
                'expired-callback'  : onRecaptchaExpired
            });
        }

        function onRecaptchaSuccess(token) {
            console.log('[JS] reCAPTCHA success, token=', token);
            window.javaConnector.onCaptchaSuccess(token);
        }
        function onRecaptchaExpired() {
            console.log('[JS] reCAPTCHA expired');
            window.javaConnector.onCaptchaError('Captcha expired – please retry');
        }
    </script>

    <style>
        /* optional enlarge badge */
        .grecaptcha-badge {
            transform: scale(1.2);
            opacity: 1 !important;
        }
    </style>
</head>
<body>
<!-- container for the checkbox -->
<div id="recaptcha"></div>
</body>
</html>
